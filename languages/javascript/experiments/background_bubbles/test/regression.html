<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bubbles.js regression tests</title>
    <style>
        /* Hostile page CSS: generic type selectors that also match bubbles.
           The library's rules must still win on specificity; wrapping them in
           @layer would let these beat .bubble-bg-bubble outright. */
        span { position: static; z-index: 0; }
        div { overflow: visible; }
        #short { width: 200px; height: 120px; }
        #tall { width: 200px; height: 400px; }
        #explicit { width: 200px; height: 100px; }
        #auto { width: 200px; height: 100px; }
        .probe { width: 200px; height: 100px; }
    </style>
    <script>
    // Installed before bubbles.js loads so no warning or observer is missed.
    window.__warns = [];
    window.__resizeObserverCount = 0;
    (function () {
        const original = console.warn;
        console.warn = function () {
            window.__warns.push(Array.from(arguments).join(" "));
            original.apply(console, arguments);
        };
        if (typeof ResizeObserver === "function") {
            const Native = ResizeObserver;
            window.ResizeObserver = function (callback) {
                window.__resizeObserverCount++;
                return new Native(callback);
            };
        }
    }());
    </script>
</head>
<body>
    <div id="short"></div>
    <div id="tall"></div>

    <!-- Carries data- attributes, but is initialized explicitly with different
         options before DOMContentLoaded. Auto-init must not undo that. -->
    <div id="explicit" data-bubbles data-count="10"></div>

    <!-- Never touched by script; must still auto-initialize from its data- attributes. -->
    <div id="auto" data-bubbles data-count="7"></div>

    <!-- Validation probes. Deliberately carry data- attributes but no
         data-bubbles, so only explicit init() reaches them. -->
    <div id="bad-data" class="probe" data-count="abc" data-speed="fast"></div>
    <div id="bad-option" class="probe"></div>
    <div id="float-count" class="probe"></div>
    <div id="px-count" class="probe"></div>
    <div id="fast-speed" class="probe"></div>
    <div id="slow-speed" class="probe"></div>
    <div id="zero-count" class="probe"></div>
    <div id="rgb-colors" class="probe" data-colors="rgb(0, 0, 0), color-mix(in srgb, red, blue)"></div>

    <!-- A typo'd option, plus a data- attribute that belongs to the site. -->
    <div id="typo" class="probe" data-bubbles data-count="3"
         data-colour="red" data-testid="hero"></div>

    <!-- Starts far below the fold so the pause behaviour is observable. -->
    <div id="offscreen" class="probe" style="margin-top: 3000px"></div>

    <script src="../bubbles.js"></script>
    <script>
    (function () {
        "use strict";

        const results = [];
        window.__results = results;
        window.__done = false;
        window.__error = null;

        function check(name, pass, detail) {
            results.push({
                name: name,
                pass: !!pass,
                detail: detail === undefined ? "" : String(detail)
            });
        }

        function bubblesIn(container) {
            return container.querySelectorAll(".bubble-bg-bubble");
        }

        // Runs fn and returns only the warnings it produced.
        function withWarnings(fn) {
            const start = window.__warns.length;
            fn();
            return window.__warns.slice(start);
        }

        // The value the bubble actually animates against. Reading the computed
        // value (not the container's inline style) is the point: a declaration
        // on the bubble would shadow the value inherited from its container.
        function travelOf(container) {
            const bubble = bubblesIn(container)[0];
            return bubble ? getComputedStyle(bubble).getPropertyValue("--bubble-travel").trim() : null;
        }

        function waitFor(predicate, timeoutMs) {
            const deadline = Date.now() + (timeoutMs || 2000);
            return new Promise((resolve) => {
                (function poll() {
                    if (predicate()) {
                        return resolve(true);
                    }
                    if (Date.now() > deadline) {
                        return resolve(false);
                    }
                    setTimeout(poll, 25);
                }());
            });
        }

        const short = document.getElementById("short");
        const tall = document.getElementById("tall");
        const explicit = document.getElementById("explicit");
        const auto = document.getElementById("auto");
        const height = (el) => el.clientHeight + "px";

        // Explicit init before DOMContentLoaded, so auto-init gets its chance
        // to clobber these values afterwards.
        Bubbles.init(short, { count: 5 });
        Bubbles.init(tall, { count: 4 });
        Bubbles.init(explicit, { count: 250 });

        check("explicit init renders the requested count",
            bubblesIn(explicit).length === 250, bubblesIn(explicit).length);

        (async function () {
            try {
                if (document.readyState === "loading") {
                    await new Promise((resolve) => {
                        document.addEventListener("DOMContentLoaded", resolve, { once: true });
                    });
                }
                await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

                // Regression: bubble travel must follow the container height,
                // not the viewport height.
                check("bubble travel equals container height",
                    travelOf(short) === height(short),
                    "computed=" + travelOf(short) + " expected=" + height(short));

                // The same value must hold for a container taller than the others,
                // proving it is per-container rather than a shared constant.
                check("travel is per container, not global",
                    travelOf(tall) === height(tall) && travelOf(short) !== travelOf(tall),
                    "short=" + travelOf(short) + " tall=" + travelOf(tall));

                // Regression: the ResizeObserver path must reach the bubbles.
                tall.style.height = "260px";
                const resized = await waitFor(() => travelOf(tall) === height(tall));
                check("travel follows a container resize", resized,
                    "computed=" + travelOf(tall) + " expected=" + height(tall));

                // Regression: auto-init must not overwrite explicit options.
                check("auto-init preserves explicit options",
                    bubblesIn(explicit).length === 250, bubblesIn(explicit).length);

                // Guard: the documented zero-JS path still works.
                check("data- attributes auto-initialize untouched elements",
                    bubblesIn(auto).length === 7, bubblesIn(auto).length);

                // Guard: re-initializing the same container replaces bubbles.
                Bubbles.init(short, { count: 3 });
                check("re-init replaces bubbles instead of appending",
                    bubblesIn(short).length === 3, bubblesIn(short).length);

                // Guard: the stylesheet is injected exactly once.
                check("stylesheet injected once",
                    document.querySelectorAll("style[data-bubble-bg]").length === 1,
                    document.querySelectorAll("style[data-bubble-bg]").length);

                const sheetText = document.querySelector("style[data-bubble-bg]").textContent;
                check("version is reported on the injected sheet",
                    document.querySelector("style[data-bubble-bg]").getAttribute("data-bubble-bg") ===
                        Bubbles.version && /^\d+\.\d+\.\d+$/.test(Bubbles.version),
                    Bubbles.version + " / " +
                        document.querySelector("style[data-bubble-bg]").getAttribute("data-bubble-bg"));

                check("rules are not hidden behind a cascade layer",
                    !sheetText.includes("@layer"),
                    sheetText.slice(0, 40));

                const hostileBubble = bubblesIn(short)[0];
                check("generic page selectors cannot displace the bubbles",
                    getComputedStyle(hostileBubble).position === "absolute" &&
                        getComputedStyle(hostileBubble).zIndex === "-1" &&
                        getComputedStyle(short).overflow === "hidden",
                    "position=" + getComputedStyle(hostileBubble).position +
                        " z-index=" + getComputedStyle(hostileBubble).zIndex +
                        " overflow=" + getComputedStyle(short).overflow);

                check("every bubble carries a static fallback position",
                    Array.from(bubblesIn(short)).every((bubble) =>
                        /%$/.test(bubble.style.getPropertyValue("--bubble-static-y"))),
                    bubblesIn(short)[0].style.getPropertyValue("--bubble-static-y"));

                check("travel is a registered length property",
                    sheetText.includes("@property --bubble-travel") &&
                        /^[0-9.]+px$/.test(travelOf(short)),
                    travelOf(short));

                // Guard: the library keeps its bookkeeping out of the page's DOM.
                check("no library bookkeeping written onto the container",
                    !("__bubblesObserved" in short) &&
                        Object.keys(short).every((key) => key.indexOf("__bubble") !== 0),
                    Object.keys(short).join(","));

                // Invalid configuration must be reported, not silently swallowed.
                const badData = document.getElementById("bad-data");
                const badDataWarns = withWarnings(() => Bubbles.init(badData));
                check("invalid data- attributes are reported",
                    badDataWarns.some((m) => /data-count/.test(m)) &&
                        badDataWarns.some((m) => /data-speed/.test(m)),
                    JSON.stringify(badDataWarns));
                check("invalid data-count falls back to the default",
                    bubblesIn(badData).length === 60, bubblesIn(badData).length);

                const badOption = document.getElementById("bad-option");
                const badOptionWarns = withWarnings(() => Bubbles.init(badOption, { count: "abc" }));
                check("invalid option is reported",
                    badOptionWarns.some((m) => /count option/.test(m)),
                    JSON.stringify(badOptionWarns));
                check("invalid option falls back to the default",
                    bubblesIn(badOption).length === 60, bubblesIn(badOption).length);

                const floatCount = document.getElementById("float-count");
                const floatWarns = withWarnings(() => Bubbles.init(floatCount, { count: 2.9 }));
                check("fractional count is rejected, not truncated",
                    bubblesIn(floatCount).length === 60 && floatWarns.some((m) => /count/.test(m)),
                    bubblesIn(floatCount).length + " " + JSON.stringify(floatWarns));

                const pxCount = document.getElementById("px-count");
                const pxWarns = withWarnings(() => Bubbles.init(pxCount, { count: "40px" }));
                check("unit-suffixed count is rejected, not read as 40",
                    bubblesIn(pxCount).length === 60 && pxWarns.some((m) => /count/.test(m)),
                    bubblesIn(pxCount).length + " " + JSON.stringify(pxWarns));

                const fastSpeed = document.getElementById("fast-speed");
                const fastWarns = withWarnings(() => Bubbles.init(fastSpeed, { speed: 1e9 }));
                const fastDuration = parseFloat(
                    bubblesIn(fastSpeed)[0].style.getPropertyValue("--bubble-anim-duration"));
                check("absurd speed is capped",
                    fastWarns.some((m) => /Speed capped/.test(m)) && fastDuration >= 1.6,
                    "duration=" + fastDuration + " " + JSON.stringify(fastWarns));

                const zeroCount = document.getElementById("zero-count");
                const zeroWarns = withWarnings(() => Bubbles.init(zeroCount, { count: 0 }));
                check("count 0 is valid and silent",
                    bubblesIn(zeroCount).length === 0 && zeroWarns.length === 0,
                    bubblesIn(zeroCount).length + " " + JSON.stringify(zeroWarns));

                const slowSpeed = document.getElementById("slow-speed");
                const slowWarns = withWarnings(() => Bubbles.init(slowSpeed, { speed: 0.001 }));
                const slowDuration = parseFloat(
                    bubblesIn(slowSpeed)[0].style.getPropertyValue("--bubble-anim-duration"));
                check("crawl speed is raised so cycles do not look frozen",
                    slowWarns.some((m) => /Speed raised/.test(m)) && slowDuration <= 700,
                    "duration=" + slowDuration + " " + JSON.stringify(slowWarns));

                // Functional color syntax in data-colors must survive splitting.
                const rgbColors = document.getElementById("rgb-colors");
                const rgbWarns = withWarnings(() => Bubbles.init(rgbColors));
                const used = [];
                bubblesIn(rgbColors).forEach((bubble) => {
                    const color = bubble.style.getPropertyValue("--bubble-color");
                    if (!used.includes(color)) {
                        used.push(color);
                    }
                });
                check("functional color syntax survives data-colors",
                    used.length === 2 && rgbWarns.length === 0,
                    JSON.stringify(used) + " " + JSON.stringify(rgbWarns));

                // A misspelled attribute should be named; the page's own data-
                // attributes should be left alone.
                const typoWarns = window.__warns.filter((message) => /data-/.test(message));
                check("misspelled data- attribute is reported",
                    typoWarns.some((message) => /data-colour/.test(message)),
                    JSON.stringify(typoWarns));
                check("the page's own data- attributes are not reported",
                    !typoWarns.some((message) => /data-testid/.test(message)),
                    JSON.stringify(typoWarns));
                check("a misspelled attribute does not stop the rest applying",
                    bubblesIn(document.getElementById("typo")).length === 3,
                    bubblesIn(document.getElementById("typo")).length);

                // One shared observer, not one per container.
                check("a single ResizeObserver serves every container",
                    window.__resizeObserverCount === 1,
                    window.__resizeObserverCount + " observer(s) for " +
                        document.querySelectorAll(".bubble-bg").length + " containers");

                // Offscreen containers should stop compositing entirely.
                const offscreenEl = document.getElementById("offscreen");
                Bubbles.init(offscreenEl, { count: 4 });
                check("visible containers keep animating",
                    !short.classList.contains("bubble-bg-paused"), short.className);

                const paused = await waitFor(() =>
                    offscreenEl.classList.contains("bubble-bg-paused"));
                const offscreenBubble = bubblesIn(offscreenEl)[0];
                check("offscreen containers pause their animation",
                    paused && getComputedStyle(offscreenBubble).animationPlayState === "paused",
                    offscreenEl.className + " " +
                        (offscreenBubble ? getComputedStyle(offscreenBubble).animationPlayState : "no bubble"));

                offscreenEl.scrollIntoView();
                const resumed = await waitFor(() =>
                    !offscreenEl.classList.contains("bubble-bg-paused"));
                check("scrolling into view resumes the animation",
                    resumed && getComputedStyle(offscreenBubble).animationPlayState === "running",
                    offscreenEl.className + " " + getComputedStyle(offscreenBubble).animationPlayState);
            } catch (error) {
                window.__error = error && error.stack ? error.stack : String(error);
            } finally {
                window.__done = true;
            }
        }());
    }());
    </script>
</body>
</html>
